name: Refresh STOCKWISE price CSV
on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"  # 18:30 Vietnam time, Mon-Fri
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy
          python -m pip install --extra-index-url https://vnstocks.com/api/simple vnstock==4.0.9
      - name: Refresh prices
        env:
          STOCKWISE_SYMBOLS: BAB,FPT,VCB,TCB,MBB,ACB,HPG,VNM
        run: python scripts/refresh_prices.py
      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_pipeline/data/prices/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh STOCKWISE price data"
            git push
          fi
